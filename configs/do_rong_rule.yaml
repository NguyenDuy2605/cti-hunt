# Cổng độ rộng của rule khâu ⑤ (do_rong_rule_v1, thêm 15/10).
#
# Trước khi chạy, mã đếm thử (không nhãn) rule giữ bao nhiêu sự kiện của nguồn log của nó trên bộ log của lượt. Rule giữ từ
# `nguong` trở lên của một nguồn khối lượng lớn thì gần như là "mọi sự kiện của nguồn", không còn là giả thuyết cụ thể: rule
# có dòng trong phiếu duyet_rule.yaml, người duyệt giữ (phải ghi lý do) hoặc bỏ. Mô hình không bao giờ thấy số này.
#
# Ngưỡng 0,5 = rule giữ quá nửa nguồn log. Trên 7 bộ OTRF (dữ liệu phát triển) ngưỡng 0,25 / 0,5 / 0,8 cho cùng nhóm rule bị
# đánh dấu; giá trị 56,9% của giả thuyết cổng 443 trên APT29 đã biết từ trước khi chọn ngưỡng.
#
# Nguồn hiếm (tạo đăng ký WMI, cài dịch vụ, tạo scheduled task…) không xét: chính loại sự kiện đã là dấu hiệu, rule giữ
# 100% nguồn hiếm vẫn có thể là rule đúng. Danh sách dưới đây là các nguồn hoạt động bình thường của Windows sinh liên tục.
version: do_rong_rule_v1
nguong: 0.5
nguon_khoi_luong_lon:
  microsoft-windows-sysmon/operational: [1, 3, 5, 7, 8, 10, 11, 12, 13, 15, 17, 18, 22, 23]
  security: [4624, 4625, 4627, 4634, 4648, 4656, 4658, 4662, 4663, 4672, 4673, 4688, 4689, 4690, 4703, 5145, 5156, 5158]
  microsoft-windows-powershell/operational: [4103, 4104]
  windows powershell: [400, 403, 600, 800]
