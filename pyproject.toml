[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-hunt"
version = "0.1.0"
description = "CTI report to verified threat hunt on Windows logs: where LLMs help and where they do not (IOC/TTP extraction, Sigma rule generation, review gates)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nguyễn Hoàng Duy" }]
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "openpyxl>=3.1",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pysigma>=1.0", "pysigma-backend-sqlite>=1.0",
       "langgraph>=1.2,<1.3", "langgraph-checkpoint-sqlite>=3,<4",
       "beautifulsoup4>=4.12,<5", "pdfplumber>=0.11,<0.12", "reportlab>=4,<5"]
# Read new reports (HTML/PDF).
ingest = ["beautifulsoup4>=4.12,<5", "pdfplumber>=0.11,<0.12"]
ocr = ["rapidocr-onnxruntime==1.4.4", "pypdfium2>=5.9,<6", "Pillow>=12.2,<13"]
# Stages 5-6: Sigma -> DuckDB queries.
sigma = ["pysigma>=1.0", "pysigma-backend-sqlite>=1.0"]
# Sigma -> SPL for the local Splunk cross-check.
splunk = ["pysigma>=1.0", "pysigma-backend-splunk==2.1.0"]
# Agent mode: LangGraph graph with SQLite checkpoints (resume after review forms).
agent = ["langgraph>=1.2,<1.3", "langgraph-checkpoint-sqlite>=3,<4"]
demo = ["streamlit>=1.30"]
# Hybrid technique retrieval (BM25 + dense embeddings, RRF); vectors stored with sqlite-vec. CPU only.
embed = ["sentence-transformers>=5,<6", "sqlite-vec>=0.1.9,<0.2"]
# HTTP API, phase 1 (`python -m cti_hunt api`, Dockerfile).
api = ["fastapi>=0.115,<1", "uvicorn>=0.30", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
cti-hunt = "cti_hunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
