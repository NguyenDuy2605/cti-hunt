[cti_wmi_dev]
homePath = $SPLUNK_DB/cti_wmi_dev/db
coldPath = $SPLUNK_DB/cti_wmi_dev/colddb
thawedPath = $SPLUNK_DB/cti_wmi_dev/thaweddb
# Retain the 2020 lab timestamps when imported in 2026.
frozenTimePeriodInSecs = 315360000
maxTotalDataSizeMB = 1024

# D14 P1 (1/10): APT29 day 2, chỉ các channel/EID trong manifest nạp; không nạp nhãn.
[cti_apt29_d2]
homePath = $SPLUNK_DB/cti_apt29_d2/db
coldPath = $SPLUNK_DB/cti_apt29_d2/colddb
thawedPath = $SPLUNK_DB/cti_apt29_d2/thaweddb
frozenTimePeriodInSecs = 315360000
maxTotalDataSizeMB = 4096

# Duyệt lọc ⑤ v2, nhánh approved (1/10): OTRF scheduled task, chỉ channel/EID mà hunt hiệu lực truy vấn.
[cti_schtasks_dev]
homePath = $SPLUNK_DB/cti_schtasks_dev/db
coldPath = $SPLUNK_DB/cti_schtasks_dev/colddb
thawedPath = $SPLUNK_DB/cti_schtasks_dev/thaweddb
